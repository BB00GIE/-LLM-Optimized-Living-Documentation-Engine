services:
  living-docs-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: living-docs-engine:latest
    container_name: living-docs-mcp-server
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Optional: Mount your own OpenAPI specs or build directory
      - ./build:/app/build:ro
      - ./examples:/app/examples:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/sse')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
