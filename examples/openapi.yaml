openapi: 3.0.3
info:
  title: Example Tasks API
  version: 1.0.0
paths:
  /api/tasks:
    get:
      operationId: listTasks
      summary: List tasks
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of tasks to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: A list of tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTask"
      responses:
        "201":
          description: The created task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{task_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTask
      summary: Get a task
      responses:
        "200":
          description: The requested task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
components:
  schemas:
    NewTask:
      type: object
      required: [title]
      properties:
        title:
          type: string
        completed:
          type: boolean
          default: false
    Task:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        completed:
          type: boolean
