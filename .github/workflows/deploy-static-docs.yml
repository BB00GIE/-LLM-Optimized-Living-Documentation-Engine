name: Deploy Static Documentation Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "static-docs-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Store Static llms*.txt
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build Living Documentation Artifacts
        run: |
          mkdir -p dist-docs
          living-docs build \
            --openapi examples/openapi.yaml \
            --markdown examples/docs \
            --python examples/src/client.py \
            --typescript examples/src/types.ts \
            --output dist-docs \
            --project-name "Living Documentation Engine"

      - name: Verify static artifacts exist
        run: |
          ls -la dist-docs
          test -f dist-docs/llms.txt
          test -f dist-docs/llms-small.txt
          test -f dist-docs/llms-full.txt
          test -f dist-docs/docs-index.json

      - name: Upload static documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: living-docs-static
          path: dist-docs/
          retention-days: 30

