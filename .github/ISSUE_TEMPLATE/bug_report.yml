name: Bug Report
description: File a bug report or unexpected error in the living documentation engine
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and resolve it quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or code snippet / CLI command to reproduce the behavior.
      placeholder: |
        1. Run `living-docs build --openapi ...`
        2. Query endpoint `get_api_spec(...)`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Operating system, Python version, MCP client (Cursor, Claude Desktop, FastMCP, etc.)
      value: |
        - OS: [e.g. Ubuntu 22.04, Windows 11, macOS 14]
        - Python Version: [e.g. 3.11.8]
        - MCP Transport: [stdio / sse]
        - Package Version: [e.g. 0.1.0]
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context or Logs
      description: Add any relevant traceback, console logs, or sample OpenAPI / markdown snippets.
