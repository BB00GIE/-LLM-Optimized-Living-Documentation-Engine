[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "living-docs-engine"
version = "0.1.0"
description = "Generate machine-optimized documentation artifacts and serve them over MCP."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Brandon Elmore" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0,<2",
    "PyYAML>=6.0",
    "tiktoken>=0.7",
]

[project.urls]
Homepage = "https://github.com/BB00GIE/-LLM-Optimized-Living-Documentation-Engine"
Repository = "https://github.com/BB00GIE/-LLM-Optimized-Living-Documentation-Engine"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
living-docs = "living_docs.cli:main"

[tool.setuptools.packages.find]
include = ["living_docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

